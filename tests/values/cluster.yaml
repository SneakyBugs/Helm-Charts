features:
  backups: false

config:
  externalDNSWebhook:
    zones:
      - sneakybugs.com.

  gateway:
    listeners:
      - hostname: "*.dev.sneakybugs.com"

  certManager:
    stagingEnvironment: true

  otlpExporter:
    endpoint: otel.dev.sneakybugs.com:4317 # Centralized OpenTelemetry Collector endpoint to export telemetry to.
