# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/application_v1alpha1.json
{{ if and .Values.features.telemetryExporter .Values.features.exporterComponents -}}
{{ $name := include "cluster.fullname" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-exporter-components
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  project: {{ .Release.Namespace }}-{{ $name }}-system
  source:
    chart: telemetry-exporter-components
    repoURL: ghcr.io/sneakybugs
    targetRevision: {{ .Values.versions.telemetryExporterComponents }}
    helm:
      releaseName: telemetry-exporter-components
      valuesObject:
        openTelemetry:
          exporterOTLPEndpoint: {{ .Values.config.otlpExporter.endpoint }}
  destination:
    name: {{ .Release.Namespace }}/{{ $name }}
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 60s
{{- end }}
