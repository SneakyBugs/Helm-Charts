# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/application_v1alpha1.json
{{ $name := include "cluster.fullname" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-system-calico
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  ignoreDifferences:
    - group: projectcalico.org
      kind: FelixConfiguration
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
  project: {{ .Release.Namespace }}-{{ $name }}-system
  source:
    chart: tigera-operator
    repoURL: https://docs.tigera.io/calico/charts
    targetRevision: {{ .Values.versions.calico }}
    helm:
      releaseName: tigera-operator
      valuesObject:
        installation:
          calicoNetwork:
            bgp: Disabled
            ipPools:
              - allowedUses:
                  - Workload
                  - Tunnel
                assignmentMode: Automatic
                blockSize: 26
                cidr: {{ .Values.config.podSubnet }}
                disableBGPExport: false
                disableNewAllocations: false
                encapsulation: VXLAN
                name: default-ipv4-ippool
                natOutgoing: Enabled
                nodeSelector: all()
  destination:
    name: {{ .Release.Namespace }}/{{ $name }}
    namespace: tigera-operator
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 60s
