{{ $name := include "cluster.fullname" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-system-calico
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  ignoreDifferences:
    - group: projectcalico.org
      kind: FelixConfiguration
  project: {{ .Release.Namespace }}-{{ $name }}-system
  source:
    chart: tigera-operator
    repoURL: https://docs.tigera.io/calico/charts
    targetRevision: {{ .Values.versions.calico }}
    helm:
      releaseName: tigera-operator
      valuesObject:
        installation:
          calicoNetwork:
            bgp: Disabled
            ipPools:
              - allowedUses:
                  - Workload
                  - Tunnel
                assignmentMode: Automatic
                blockSize: 26
                cidr: {{ .Values.config.podSubnet }}
                disableBGPExport: false
                disableNewAllocations: false
                encapsulation: VXLAN
                name: default-ipv4-ippool
                natOutgoing: Enabled
                nodeSelector: all()
  destination:
    name: {{ .Release.Namespace }}/{{ $name }}
    namespace: tigera-operator
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
