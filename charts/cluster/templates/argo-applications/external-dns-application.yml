# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/application_v1alpha1.json
{{ $name := include "cluster.fullname" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-system-external-dns
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  project: {{ .Release.Namespace }}-{{ $name }}-system
  source:
    chart: external-dns
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    targetRevision: {{ .Values.versions.externalDNS }}
    helm:
      releaseName: external-dns
      valuesObject:
        sources:
          - service
          - gateway-grpcroute
          - gateway-httproute
        provider:
          name: webhook
          webhook:
            image:
              repository: {{ .Values.config.externalDNSWebhook.repository }}
              tag: {{ .Values.config.externalDNSWebhook.tag }}
            env:
              # TODO Remove after debugging the External DNS issue.
              - name: WEBHOOK_VERBOSE
                value: "true"
              - name: WEBHOOK_API_ENDPOINT
                valueFrom:
                  configMapKeyRef:
                    name: cluster-components-external-dns-webhook
                    key: apiEndpoint
              - name: WEBHOOK_API_ID
                valueFrom:
                  secretKeyRef:
                    name: cluster-components-external-dns-webhook
                    key: id
              - name: WEBHOOK_API_SECRET
                valueFrom:
                  secretKeyRef:
                    name: cluster-components-external-dns-webhook
                    key: secret
              - name: WEBHOOK_ZONES
                valueFrom:
                  configMapKeyRef:
                    name: cluster-components-external-dns-webhook
                    key: zones
            livenessProbe:
              httpGet:
                path: /-/liveness
                port: 8888
            readinessProbe:
              httpGet:
                path: /-/readiness
                port: 8888
  destination:
    name: {{ .Release.Namespace }}/{{ $name }}
    namespace: external-dns
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 60s
