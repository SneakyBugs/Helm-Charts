# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/application_v1alpha1.json
{{ if .Values.features.backups -}}
{{ $name := include "cluster.fullname" . -}}
{{ $defaultBucketName := printf "%s-%s-backup" .Release.Namespace (include "cluster.fullname" .) -}}
{{ $bucketName := default $defaultBucketName .Values.config.velero.storage.existingObjectBucketClaim }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-system-velero
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  project: {{ .Release.Namespace }}-{{ $name }}-system
  source:
    chart: velero
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: {{ .Values.versions.velero }}
    helm:
      releaseName: velero
      valuesObject:
        # Handled by Argo CD.
        upgradeCRDs: false
        image:
          repository: docker.io/velero/velero
        initContainers:
          - name: velero-plugin-for-aws
            image: docker.io/velero/velero-plugin-for-aws:v{{ .Values.versions.veleroPluginForAWS }}
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins
        snapshotsEnabled: false
        deployNodeAgent: true
        configuration:
          features: EnableCSI
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: {{ $bucketName }}
              prefix: {{ .Values.config.velero.storage.prefix | default (printf "%s:%s" .Release.Namespace $name) }}
              default: true
              accessMode: {{ .Values.config.velero.storage.accessMode }}
              credential:
                name: ceph-object-user-velero
                key: veleroCredentials
              config:
                region: ceph
                s3ForcePathStyle: true
                s3Url: {{ .Values.config.velero.storage.s3Url }}
        schedules:
          default:
            annotations:
              argocd.argoproj.io/compare-options: IgnoreExtraneous
            schedule: {{ .Values.config.velero.backup.schedule | quote }}
            template:
              ttl: {{ .Values.config.velero.backup.ttl }}
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
          requests:
            cpu: 125m
            memory: 256Mi
        nodeAgent:
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
  destination:
    name: {{ .Release.Namespace }}/{{ $name }}
    namespace: velero
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 60s
{{- end }}
