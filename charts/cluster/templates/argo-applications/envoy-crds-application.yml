# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/application_v1alpha1.json
{{ $name := include "cluster.fullname" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-envoy-crds
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  project: {{ .Release.Namespace }}-{{ $name }}-system
  source:
    chart: gateway-crds-helm
    repoURL: docker.io/envoyproxy
    targetRevision: {{ .Values.versions.envoyGateway }}
    helm:
      valuesObject:
        crds:
          gatewayAPI:
            enabled: true
          envoyGateway:
            enabled: true
  destination:
    name: {{ .Release.Namespace }}/{{ $name }}
    namespace: envoy
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 60s
