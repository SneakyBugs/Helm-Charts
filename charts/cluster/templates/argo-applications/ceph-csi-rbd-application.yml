# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/application_v1alpha1.json
{{ $name := include "cluster.fullname" . -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Namespace }}-{{ $name }}-ceph-csi
  namespace: {{ .Values.argocdNamespace }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  project: {{ .Release.Namespace }}-{{ $name }}-system
  source:
    chart: ceph-csi-rbd
    repoURL: https://ceph.github.io/csi-charts
    targetRevision: {{ .Values.versions.cephCSIRBD }}
    helm:
      releaseName: ceph-csi-rbd
      valuesObject:
        provisioner:
          replicaCount: 2
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
        csiConfig:
        - clusterID: external
          monitors: {{- toYaml .Values.config.cephCSIRBD.cephMonitors | nindent 12 }}
          rbd:
            netNamespaceFilePath: ''
            radosNamespace: {{ .Release.Namespace }}-{{ include "cluster.fullname" . }}
            mirrorDaemonCount: 0
  destination:
    name: {{ .Release.Namespace }}/{{ $name }}
    namespace: ceph-csi-rbd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 60s
