# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/controlplane.cluster.x-k8s.io/kubeadmcontrolplane_v1beta2.json
{{ $name := include "cluster.fullname" . -}}
kind: KubeadmControlPlane
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
metadata:
  name: {{ include "cluster.fullname" . }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.config.controlPlane.replicas }}
  machineTemplate:
    spec:
      infrastructureRef:
        kind: KubevirtMachineTemplate
        apiGroup: infrastructure.cluster.x-k8s.io
        {{- $cpConfig := printf "%s:%s" .Values.config.image (toJson (omit .Values.config.controlPlane "replicas")) }}
        {{- $cpID := sha256sum $cpConfig | trunc 8 }}
        name: {{ $name }}-cp-{{ $cpID }}
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs:
          - name: tracing-config-file
            value: /etc/kubernetes/apiserver/tracing-configuration.yaml
        extraVolumes:
          - hostPath: /etc/kubernetes/apiserver
            mountPath: /etc/kubernetes/apiserver
            name: configs
      controllerManager:
        extraArgs:
          - name: bind-address
            value: "0.0.0.0"
      scheduler:
        extraArgs:
          - name: bind-address
            value: "0.0.0.0"
      etcd:
        local:
          extraArgs:
            - name: listen-metrics-urls
              value: http://0.0.0.0:2381
            - name: experimental-enable-distributed-tracing
              value: "true"
            - name: experimental-distributed-tracing-address
              value: telemetry-exporter-components-collector.telemetry.svc.cluster.local:4317
    files:
      - path: /etc/kubernetes/apiserver/tracing-configuration.yaml
        owner: "root:root"
        permissions: "0644"
        content: |
          apiVersion: apiserver.config.k8s.io/v1beta1
          kind: TracingConfiguration
          endpoint: telemetry-exporter-components-collector.telemetry.svc.cluster.local:4317
          samplingRatePerMillion: 10000
      - path: /etc/kubernetes/kubelet/config.yaml
        owner: "root:root"
        permissions: "0644"
        content: |
          apiVersion: kubelet.config.k8s.io/v1beta1
          kind: KubeletConfiguration
          authentication:
            webhook:
              enabled: true
          authorization:
            mode: Webhook
      - path: /etc/containers/registries.conf
        content: |
          unqualified-search-registries = ["docker.io"]
          {{- range .Values.config.imageRegistries }}
          [[registry]]
          prefix = {{ quote .prefix }}
          location = {{ quote .location }}
          {{- end }}
  version: {{ .Values.config.version | quote }}
