# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "telemetry-system-components.fullname" . }}-grafana
  labels:
    {{- include "telemetry-system-components.labels" . | nindent 4 }}
spec:
  parentRefs: {{- .Values.grafana.httproute.parentRefs | toYaml | nindent 4 }}
  hostnames:
    - {{ .Values.grafana.httproute.hostname }}
  rules:
    - backendRefs:
      - name: grafana-service
        port: 3000
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "5m"
