# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rook-ceph-client-csi-rbd-node
  namespace: {{ .Values.cephCSIRBD.namespace }}
  labels:
    {{- include "cluster-components.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: rook-ceph
  target:
    name: ceph-csi-rbd-node
  data:
  - secretKey: userID
    remoteRef:
      key: {{ .Values.cephCSIRBD.nodeClientSecretRemoteKey }}
      property: userID
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: userKey
    remoteRef:
      key: {{ .Values.cephCSIRBD.nodeClientSecretRemoteKey }}
      property: userKey
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rook-ceph-client-csi-rbd-provisioner
  namespace: {{ .Values.cephCSIRBD.namespace }}
  labels:
    {{- include "cluster-components.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: rook-ceph
  target:
    name: ceph-csi-rbd-provisioner
  data:
  - secretKey: userID
    remoteRef:
      key: {{ .Values.cephCSIRBD.provisionerClientSecretRemoteKey }}
      property: userID
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: userKey
    remoteRef:
      key: {{ .Values.cephCSIRBD.provisionerClientSecretRemoteKey }}
      property: userKey
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
