# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
{{ $name := include "cluster-components.fullname" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-cert-manager-token
  namespace: {{ .Values.certManager.namespace }}
  labels:
    {{- include "cluster-components.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
  target:
    name: {{ $name }}-cert-manager-token
  data:
  - secretKey: cloudflareToken
    remoteRef:
      key: {{ .Values.certManager.externalSecret.remoteKey }}
      property: {{ .Values.certManager.externalSecret.cloudflareTokenProperty }}
